name: Bug report
description: Report a reproducible problem with Mirac Wicked HUD
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please test with an unmodified ox_lib installation and include enough
        information to reproduce the problem.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: HUD, qbx_core, ox_lib and FiveM artifact versions
      placeholder: "HUD 1.2.0, qbx_core ..., ox_lib ..., artifact ..."
    validations:
      required: true
  - type: dropdown
    id: game_build
    attributes:
      label: Game environment
      options:
        - GTAV Legacy
        - GTAV Enhanced
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Enter ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, identifiers and other sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested with the documented resource name and start order.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
